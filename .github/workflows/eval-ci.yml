name: Multimodel Eval Regression

# AI 智能助手多模型横向评测回归基线

on:
  push:
  pull_request:

jobs:
  multimodel-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 离线 mock 模式，只需 dotenv（eval_multimodel 用标准库 urllib，无需 openai SDK）
      - name: 安装依赖
        run: pip install python-dotenv

      - name: 多模型横向评测基线
        run: python eval_multimodel.py
